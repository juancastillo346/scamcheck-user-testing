<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta name="description" content="ScamCheck usability prototype." />
    <title>ScamCheck</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#intro"><span class="brand-mark">✓</span> ScamCheck</a>
        <span class="prototype-label">PROTOTYPE</span>
      </header>
      <nav class="task-tabs" aria-label="Study tasks">
        <a href="#intro" data-tab="intro">Intro</a>
        <a href="#task1" data-tab="task1">Task 1</a>
        <a href="#task2" data-tab="task2">Task 2</a>
        <a href="#task3" data-tab="task3">Task 3</a>
      </nav>
      <section class="scenario" aria-live="polite">
        <div class="scenario-heading"><div><p class="eyebrow" id="scenario-step">INTRO · EXAMPLE 1 OF 5</p><h1 id="scenario-title">Intro task</h1></div><span class="context-tag">CONTEXT</span></div>
        <p class="context-text" id="context-text"></p>
      </section>
      <section class="device-area" aria-label="iPhone preview">
        <div class="phone-frame" id="phone-frame">
          <div class="phone-hardware-top">
            <span class="phone-time">9:41</span>
            <span class="phone-island" aria-hidden="true"></span>
            <span class="phone-status-icons" aria-label="Cellular signal, Wi-Fi, battery">
              <svg viewBox="0 0 58 16" role="img" aria-hidden="true">
                <path d="M2 14V11h3v3zm5 0V8h3v6zm5 0V5h3v9zm5 0V2h3v12z" fill="currentColor"/>
                <path d="M26 6.1a13 13 0 0 1 18 0l-2 2.2a10 10 0 0 0-14 0zM29 9.2a8.5 8.5 0 0 1 12 0l-2.1 2.1a5.5 5.5 0 0 0-7.8 0zM33 13a3 3 0 0 1 4 0l-2 2z" fill="currentColor"/>
                <rect x="47" y="3" width="9" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="49" y="5" width="5" height="7" rx="1" fill="currentColor"/><path d="M50 1.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
          </div>
          <div class="phone-screen" id="phone-screen"></div>
          <div class="phone-hardware-bottom"><span></span></div>
        </div>
      </section>
      <footer class="footer-note">ScamCheck is a prototype. It only analyzes the sample text shown here.</footer>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
